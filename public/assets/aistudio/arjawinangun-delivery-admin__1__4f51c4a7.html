vfu:()=>{const v=V.find(x=>x.t==S.tab);v.fu^=1;log((v.fu?'Mengaktifkan':'Mematikan')+' wajib perbarui '+T[v.t].n);render()},vmt:()=>{const v=V.find(x=>x.t==S.tab);v.mt^=1;log((v.mt?'Mengaktifkan':'Mematikan')+' pemeliharaan '+T[v.t].n);render()},

jadd:()=>{const v=$('#jnew').value.trim();if(!v){toast('Nama jenis wajib diisi');return}if(JN.some(j=>j.toLowerCase()==v.toLowerCase())){toast('Jenis sudah ada');return}JN.push(v);log('Menambah jenis promo '+v);API.req('POST','/jenis_promo',{nama:v});render();toast('Jenis “'+v+'” ditambahkan')},
jdel:i=>{const j=JN[+i];if(CMS.some(c=>c.jn==j)){toast('Jenis masih dipakai spanduk; ubah atau hapus spanduknya dulu');return}if(JN.length<2){toast('Minimal satu jenis harus ada');return}JN.splice(+i,1);if(S.cj==j)S.cj='';log('Menghapus jenis promo '+j);render();toast('Jenis dihapus')},

const LB=(()=>{const d=document.createElement('div');d.id='lb';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Pembesaran foto');d.innerHTML='<button id="lbx" type="button" aria-label="Tutup">✕</button><img id="lbi" alt=""><div id="lbc"></div>';document.body.appendChild(d);const off=()=>d.classList.remove('on');d.addEventListener('click',off);return{open(im){$('#lbi').src=im.src;$('#lbi').alt=im.alt||'Foto';$('#lbc').textContent=im.alt||'';d.classList.add('on');$('#lbx').focus()},close:off,on:()=>d.classList.contains('on')}})();

/* Notifikasi transaksi. Produksi: Supabase Realtime pada tabel pesanan, mis.
   sb.channel('pesanan').on('postgres_changes',{event:'INSERT',schema:'public',table:'pesanan'},p=>notifyOrder(mapPesanan(p.new),'baru')).subscribe() */
const TTL={baru:'🔔 Pesanan baru ',proses:'🛵 Driver ditugaskan ',selesai:'✅ Pesanan selesai ',batal:'❌ Pesanan dibatalkan '};
const beep=()=>{if(!S.snd||!AC)return;try{const t=AC.currentTime;[880,1175].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.14);g.gain.exponentialRampToValueAtTime(.15,t+i*.14+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.14+.18);o.connect(g);g.connect(AC.destination);o.start(t+i*.14);o.stop(t+i*.14+.2)})}catch(e){}};
addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}});
function renderBell(){const u=NQ.filter(n=>!n.r).length,b=$('#bdg');b.textContent=u>99?'99+':u;b.classList.toggle('on',u>0);
$('#np').innerHTML=`<div class="tb" style="margin:0 0 6px"><b>Notifikasi transaksi</b><span class="sp"></span><button class="btn" data-a="nread">Tandai dibaca</button></div>${NQ.length?NQ.map(n=>`<div class="ni ${n.r?'':'un'}" data-a="nopen" data-i="${n.id}"><span style="font-size:20px">${{baru:'🛒',proses:'🛵',selesai:'✅',batal:'❌'}[n.jn]}</span><div><b>${{baru:'Pesanan baru',proses:'Driver ditugaskan',selesai:'Pesanan selesai',batal:'Pesanan dibatalkan'}[n.jn]} ${esc(n.id)}</b><div class="mu" style="font-size:12px">${esc(n.c)} → ${esc(n.m)} · ${rp(n.p)}</div><div class="mu" style="font-size:12px">${n.tm}</div></div></div>`).join(''):'<p class="mu" style="margin:8px 0">Belum ada transaksi baru. Pesanan dari Aplikasi Pelanggan muncul di sini secara langsung.</p>'}<div class="tb" style="margin:10px 0 0;gap:10px;flex-wrap:wrap"><button class="btn" data-a="nperm">Aktifkan notifikasi browser</button><label class="mu" style="margin:0"><input type="checkbox" data-c="snd" ${S.snd?'checked':''}> Suara</label>${API.MOCK?`<label class="mu" style="margin:0"><input type="checkbox" data-c="sim" ${S.sim?'checked':''}> Simulasi otomatis (demo)</label><span class="sp"></span><button class="btn" data-a="nsim">Simulasikan transaksi</button>`:''}</div>`}
function notifyOrder(o,jn){const d=new Date();NQ.unshift({id:o.id,c:o.c,m:o.m,p:o.p,jn,tm:d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'),r:false});NQ.length=Math.min(NQ.length,30);renderBell();sbr();toast(TTL[jn]+o.id+' · '+rp(o.p));beep();sysNotify(TTL[jn].replace(/^\S+\s/,'')+o.id,o.c+' → '+o.m+' · '+rp(o.p));if(S.p=='orders'&&!$('#ov').classList.contains('on'))render()}
function simOrder(){const C=D.filter(r=>r.t=='customer'),M=D.filter(r=>r.t=='merchant'&&r.s=='Buka');if(!C.length||!M.length)return;const c=C[Math.floor(Math.random()*C.length)],m=M[Math.floor(Math.random()*M.length)],n=O.reduce((a,o)=>Math.max(a,+o.id.slice(4)),2400)+1,o={id:'ORD-'+n,c:c.name,m:m.name,d:'',s:'Baru',p:15000+Math.floor(Math.random()*20)*2500};O.unshift(o);notifyOrder(o,'baru')}
let simT=0;function simTick(){if(S.sim&&API.MOCK){const o=O.find(x=>x.s=='Diantar'||x.s=='Diproses');if(simT%3==2&&o){o.s='Selesai';notifyOrder(o,'selesai')}else if(simT<14)simOrder();if(simT%4==1&&simT<14)simMsg();simT++}setTimeout(simTick,40000)}
setTimeout(simTick,15000);renderBell();
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&LB.on()){LB.close();e.stopImmediatePropagation()}},true);
document.addEventListener('click',e=>{if(!e.target.closest('#np,#bell'))$('#np').classList.remove('on');const im=e.target.closest('img');if(im&&!im.classList.contains('lg')&&im.src&&!im.closest('[data-a]')&&im.closest('#c,#md')){LB.open(im);return}const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){if(t.dataset.a=='sw')t.classList.toggle('on');else A[t.dataset.a](t.dataset.i)}else if(e.target.id=='ov')A.close()});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c=='role'){S.role=e.target.value;log('Berganti peran ke '+S.role);render()}else if(c=='f'){S.f=e.target.value;$('#tbl').innerHTML=TB(cur())}else if(c=='asg'){const o=O.find(x=>x.id==e.target.dataset.i);o.d=e.target.value;if(o.d&&o.s=='Baru')o.s='Diproses';log('Menugaskan '+(o.d||'-')+' ke '+o.id);render();if(o.d)notifyOrder(o,'proses')}else if(c=='ph'){const f=e.target.files[0];if(!f)return;const k=e.target.dataset.i,rd=new FileReader();rd.onload=()=>{const r=D.find(x=>x.id==S.sel);r[k=='p'?'photo':'vph']=rd.result;log('Mengganti foto '+r.name);render()};rd.readAsDataURL(f)}else if(c=='pf'){const f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png'].includes(f.type)){toast('Foto harus berformat JPG atau PNG');e.target.value='';return}if(f.size>2*1024*1024){toast('Ukuran foto maksimal 2 MB');e.target.value='';return}const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,800/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.pimg=cv.toDataURL(f.type=='image/png'?'image/png':'image/jpeg',.85);$('#pprev').innerHTML='<img src="'+S.pimg+'" alt="Foto produk">';$('#pfn').textContent=f.name};im.onerror=()=>toast('File foto tidak bisa dibaca');im.src=rd.result};rd.readAsDataURL(f)}else if(c=='lf'){const f=e.target.files[0];if(!f)return;imgFile(f,(u,n)=>{S.limg=u;$('#lprev').innerHTML='<img src="'+u+'" alt="Foto / logo toko">';$('#lfn').textContent=n});e.target.value=''}else if(c=='bpre'){const v=e.target.value;if(v!='custom'){const q=v.split('x');$('#bw').value=q[0];$('#bh').value=q[1]}}else if(c=='bpos'){S.bpos=e.target.value;if(S.bsrc)cropRe();else toast('Unggah ulang gambar untuk mengubah posisi potong')}else if(c=='bf'){const f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png'].includes(f.type)){toast('Gambar harus berformat JPG atau PNG');e.target.value='';return}if(f.size>3*1024*1024){toast('Ukuran gambar maksimal 3 MB');e.target.value='';return}const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{S.bsrc={im,type:f.type};cropRe()};im.onerror=()=>toast('File gambar tidak bisa dibaca');im.src=rd.result};rd.readAsDataURL(f)}else if(c=='snd'){S.snd=e.target.checked}else if(c=='sim'){S.sim=e.target.checked}else if(c=='min'){const v=V.find(x=>x.t==S.tab);v.min=e.target.value;log('Versi minimum '+T[v.t].n+' → '+v.min)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;$('#tbl').innerHTML=TB(cur())}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')A.close()});
render();
